# ==============================================================================
# Financial Intelligence & Big Data Analytics Platform
# Single-Host Multi-Container Distributed Hadoop 3 & Spark 3 Cluster
#
# Cluster Topology:
#   - hadoop-master:  NameNode (9870, 9000), ResourceManager (8088), JobHistory (19888), Spark Master (8080, 7077)
#   - hadoop-worker1: DataNode (9864), NodeManager (8042), Spark Worker (8081)
#   - hadoop-worker2: DataNode (9865), NodeManager (8043), Spark Worker (8082)
#   - mongodb:        MongoDB 7.0 (27017) NoSQL Persistence Layer
#
# Academic Transparency Note:
#   This configuration deploys three logical nodes in separate Linux containers on a
#   single physical host. It demonstrates multi-process distributed service configuration,
#   HDFS replication factor 2, YARN multi-node scheduling, and Spark standalone clustering.
# ==============================================================================

version: "3.8"

services:
  # ── Master Node (NameNode, ResourceManager, JobHistory, Spark Master) ──────
  hadoop-master:
    build:
      context: ./docker/cluster
      dockerfile: Dockerfile
    image: financial-analytics/hadoop-spark-cluster:3.3.6-3.5.1
    hostname: hadoop-master
    container_name: hadoop-master
    restart: unless-stopped
    environment:
      - NODE_TYPE=master
      - HDFS_REPLICATION=2
    ports:
      - "9870:9870"   # HDFS NameNode Web UI
      - "9000:9000"   # HDFS NameNode RPC
      - "8088:8088"   # YARN ResourceManager Web UI
      - "8032:8032"   # YARN RM IPC
      - "19888:19888" # MapReduce JobHistory Web UI
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    volumes:
      - hadoop_namenode:/opt/hadoop/data/nameNode
      - ./data:/opt/project/data
      - ./scripts:/opt/project/scripts
      - ./src:/opt/project/src
    networks:
      - hadoop-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ── Worker Node 1 (DataNode 1, NodeManager 1, Spark Worker 1) ───────────────
  hadoop-worker1:
    build:
      context: ./docker/cluster
      dockerfile: Dockerfile
    image: financial-analytics/hadoop-spark-cluster:3.3.6-3.5.1
    hostname: hadoop-worker1
    container_name: hadoop-worker1
    restart: unless-stopped
    environment:
      - NODE_TYPE=worker
    depends_on:
      - hadoop-master
    ports:
      - "9864:9864"   # DataNode 1 Web UI
      - "8042:8042"   # NodeManager 1 Web UI
      - "8081:8081"   # Spark Worker 1 Web UI
    volumes:
      - hadoop_datanode1:/opt/hadoop/data/dataNode
    networks:
      - hadoop-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ── Worker Node 2 (DataNode 2, NodeManager 2, Spark Worker 2) ───────────────
  hadoop-worker2:
    build:
      context: ./docker/cluster
      dockerfile: Dockerfile
    image: financial-analytics/hadoop-spark-cluster:3.3.6-3.5.1
    hostname: hadoop-worker2
    container_name: hadoop-worker2
    restart: unless-stopped
    environment:
      - NODE_TYPE=worker
    depends_on:
      - hadoop-master
    ports:
      - "9865:9864"   # DataNode 2 Web UI (Host Port 9865 -> Container 9864)
      - "8043:8042"   # NodeManager 2 Web UI (Host Port 8043 -> Container 8042)
      - "8082:8081"   # Spark Worker 2 Web UI (Host Port 8082 -> Container 8081)
    volumes:
      - hadoop_datanode2:/opt/hadoop/data/dataNode
    networks:
      - hadoop-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ── MongoDB NoSQL Layer (Phase 3 Persistence) ──────────────────────────────
  mongodb:
    image: mongo:7.0
    hostname: mongodb
    container_name: financial-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=financial_analytics
    volumes:
      - mongodb_data:/data/db
    networks:
      - hadoop-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

volumes:
  hadoop_namenode:
    name: financial_hadoop_namenode
  hadoop_datanode1:
    name: financial_hadoop_datanode1
  hadoop_datanode2:
    name: financial_hadoop_datanode2
  mongodb_data:
    name: financial_mongodb_data

networks:
  hadoop-network:
    name: financial_hadoop_network
    driver: bridge
